---
- Media:
    # Seerr is the front door: one search box for movies + TV, routed to
    # Radarr/Sonarr. Widget type is still `jellyseerr` despite the rename.
    # Generate the key in Seerr -> Settings -> General -> API Key.
    - Seerr:
        icon: jellyseerr.png
        href: http://<TAILSCALE_IP>:5055
        description: Search & request
        widget:
          type: jellyseerr
          url: http://127.0.0.1:5055
          key: <SEERR_API_KEY>

    - Jellyfin:
        icon: jellyfin.png
        href: http://<TAILSCALE_IP>:8096
        description: Media server
        # Native jellyfin widget breaks on recent builds (/emby 404, query api_key 401).
        # Use customapi + header auth against /Items/Counts instead.
        widget:
          type: customapi
          url: http://localhost:8096/Items/Counts
          method: GET
          headers:
            Authorization: MediaBrowser Token="<JELLYFIN_API_KEY>"
          mappings:
            - field: SeriesCount
              label: Shows
            - field: MovieCount
              label: Movies
            - field: EpisodeCount
              label: Episodes

    - Sonarr:
        icon: sonarr.png
        href: http://<TAILSCALE_IP>:8989
        description: TV automation
        widget:
          type: sonarr
          url: http://localhost:8989
          key: <SONARR_API_KEY>

    - Radarr:
        icon: radarr.png
        href: http://<TAILSCALE_IP>:7878
        description: Movie automation
        widget:
          type: radarr
          url: http://localhost:7878
          key: <RADARR_API_KEY>

    - Prowlarr:
        icon: prowlarr.png
        href: http://<TAILSCALE_IP>:9696
        description: Indexers
        widget:
          type: prowlarr
          url: http://localhost:9696
          key: <PROWLARR_API_KEY>

- Downloads:
    - Transmission:
        icon: transmission.png
        href: http://<TAILSCALE_IP>:9091
        description: Download client (download-only)
        widget:
          type: transmission
          # Use 127.0.0.1, NOT localhost: Transmission binds IPv4 only, but Node
          # resolves localhost to ::1 (IPv6) first, so the widget can't connect.
          url: http://127.0.0.1:9091
          username: <DL_USER>
          password: <DL_PASS>
