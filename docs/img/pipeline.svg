<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect width="900" height="300" fill="#0f172a"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <text x="32" y="40" fill="#e2e8f0" font-size="18" font-weight="700">The automated flow</text>

  <!-- nodes -->
  <g font-size="13" font-weight="600">
    <rect x="32"  y="70" width="150" height="58" rx="10" fill="#1e293b" stroke="#3b82f6"/>
    <text x="107" y="96"  fill="#e2e8f0" text-anchor="middle">Sonarr / Radarr</text>
    <text x="107" y="114" fill="#64748b" text-anchor="middle" font-size="11" font-weight="400">you add a title</text>

    <rect x="232" y="70" width="150" height="58" rx="10" fill="#1e293b" stroke="#f97316"/>
    <text x="307" y="96"  fill="#e2e8f0" text-anchor="middle">Prowlarr</text>
    <text x="307" y="114" fill="#64748b" text-anchor="middle" font-size="11" font-weight="400">searches indexers</text>

    <rect x="432" y="70" width="150" height="58" rx="10" fill="#1e293b" stroke="#ef4444"/>
    <text x="507" y="96"  fill="#e2e8f0" text-anchor="middle">Transmission</text>
    <text x="507" y="114" fill="#64748b" text-anchor="middle" font-size="11" font-weight="400">grabs (download-only)</text>

    <rect x="632" y="70" width="150" height="58" rx="10" fill="#1e293b" stroke="#22c55e"/>
    <text x="707" y="90"  fill="#e2e8f0" text-anchor="middle">hardlink + rename</text>
    <text x="707" y="114" fill="#64748b" text-anchor="middle" font-size="11" font-weight="400">/data/media/{tv,movies}</text>
  </g>

  <!-- arrows top row -->
  <g stroke="#475569" stroke-width="2">
    <line x1="182" y1="99" x2="230" y2="99" marker-end="url(#arr)"/>
    <line x1="382" y1="99" x2="430" y2="99" marker-end="url(#arr)"/>
    <line x1="582" y1="99" x2="630" y2="99" marker-end="url(#arr)"/>
  </g>

  <!-- jellyfin -->
  <rect x="632" y="190" width="150" height="58" rx="10" fill="#1e293b" stroke="#a855f7"/>
  <text x="707" y="216" fill="#e2e8f0" text-anchor="middle" font-size="13" font-weight="600">Jellyfin</text>
  <text x="707" y="234" fill="#64748b" text-anchor="middle" font-size="11">serves every device</text>
  <line x1="707" y1="128" x2="707" y2="188" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- staging note -->
  <rect x="432" y="190" width="150" height="58" rx="10" fill="#0b1220" stroke="#334155" stroke-dasharray="4 3"/>
  <text x="507" y="214" fill="#94a3b8" text-anchor="middle" font-size="12">/data/torrents</text>
  <text x="507" y="232" fill="#64748b" text-anchor="middle" font-size="11">fast staging disk</text>
  <line x1="507" y1="128" x2="507" y2="188" stroke="#334155" stroke-width="2" stroke-dasharray="4 3"/>

  <text x="32" y="232" fill="#64748b" font-size="12">Same filesystem for staging + library →</text>
  <text x="32" y="250" fill="#64748b" font-size="12">imports are instant hardlinks, not copies.</text>

  <text x="450" y="288" fill="#334155" font-size="11" text-anchor="middle">Add once; search → grab → organize → serve happens automatically.</text>
</svg>
